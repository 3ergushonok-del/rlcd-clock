; Waveshare ESP32-S3-RLCD-4.2 — погода и дата
; ESP32-S3-WROOM-1-N16R8: 16 МБ flash, 8 МБ PSRAM, экран ST7305 400x300

[env:rlcd42]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; upload_port намеренно не задан — PlatformIO найдёт плату сам.
; Если портов несколько, укажи вручную: pio run -t upload --upload-port COM5
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

board_build.filesystem = littlefs

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -Iinclude

; Если путь к проекту содержит кириллицу или пробелы, линкер xtensa не сможет
; записать map-файл. В этом случае раскомментируй (путь должен быть ASCII):
;
; [platformio]
; build_dir = C:/pio-build/rlcd-clock